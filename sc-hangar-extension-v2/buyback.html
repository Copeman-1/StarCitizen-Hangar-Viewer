<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyback Queue - SC Hangar Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(51, 65, 85, 0.5);
            border: none;
            border-radius: 8px;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(51, 65, 85, 0.8);
        }

        .tab.active {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid rgba(245, 158, 11, 0.3);
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #f59e0b;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.5);
            color: #e2e8f0;
            font-size: 1rem;
        }

        .select-box {
            padding: 12px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.5);
            color: #e2e8f0;
            font-size: 1rem;
            min-width: 150px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .item-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f59e0b;
        }

        .item-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d97706;
        }

        .item-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .item-detail {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        .tag {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 Buyback Queue</h1>
            <p>View items in your buyback queue</p>
        </header>

        <div class="tabs">
            <button class="tab" data-tab="hangar">My Hangar</button>
            <button class="tab active" data-tab="buyback">Buyback Queue</button>
            <button class="tab" data-tab="wishlist">Wishlist</button>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Total Items</div>
                <div class="stat-value" id="totalItems">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Value</div>
                <div class="stat-value" id="totalValue">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">With Store Credit</div>
                <div class="stat-value" id="creditItems">0</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchBox" class="search-box" placeholder="Search items...">
            <select id="typeFilter" class="select-box">
                <option value="all">All Types</option>
                <option value="Ship">Ships</option>
                <option value="Package">Packages</option>
                <option value="Ground Vehicle">Ground Vehicles</option>
                <option value="Paint">Paints</option>
            </select>
            <select id="sortBy" class="select-box">
                <option value="name">Sort by Name</option>
                <option value="value">Sort by Value</option>
            </select>
        </div>

        <div id="content">
            <div class="empty-state">
                <h2>No Buyback Data Found</h2>
                <p>Please extract your buyback data first.</p>
                <p>Go to Account > Buy Back Pledges and click "Extract Hangar Data"</p>
            </div>
        </div>
    </div>

    <script src="buyback.js"></script>
</body>
</html>
