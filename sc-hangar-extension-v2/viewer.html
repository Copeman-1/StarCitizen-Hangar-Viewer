<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Citizen Hangar Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%);
            color: #e0e6ed;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid rgba(99, 179, 237, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #63b3ed 0%, #4299e1 50%, #3182ce 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(99, 179, 237, 0.2);
        }

        .stat-card {
            flex: 1;
            min-width: 200px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(66, 153, 225, 0.1) 0%, rgba(49, 130, 206, 0.1) 100%);
            border-radius: 10px;
            border: 1px solid rgba(99, 179, 237, 0.3);
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #63b3ed;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(99, 179, 237, 0.3);
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 1rem;
        }

        .search-box:focus {
            outline: none;
            border-color: #63b3ed;
            background: rgba(255, 255, 255, 0.08);
        }

        .sort-select {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(99, 179, 237, 0.3);
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 1rem;
            cursor: pointer;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(99, 179, 237, 0.2);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: #63b3ed;
            box-shadow: 0 8px 30px rgba(66, 153, 225, 0.3);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .item-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e0e6ed;
            flex: 1;
        }

        .item-melt {
            font-size: 1.4rem;
            font-weight: bold;
            color: #48bb78;
            white-space: nowrap;
            margin-left: 10px;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(99, 179, 237, 0.1);
        }

        .detail-label {
            color: #a0aec0;
        }

        .detail-value {
            color: #e0e6ed;
            font-weight: 500;
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(66, 153, 225, 0.2);
            border: 1px solid rgba(99, 179, 237, 0.4);
            border-radius: 6px;
            font-size: 0.85rem;
            color: #63b3ed;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 2px dashed rgba(99, 179, 237, 0.3);
        }

        .empty-state h2 {
            color: #a0aec0;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⭐ Star Citizen Hangar Viewer</h1>
            <p>Your complete fleet overview</p>
        </div>

        <div id="content"></div>
    </div>

    <script src="viewer.js"></script>
</body>
</html>
