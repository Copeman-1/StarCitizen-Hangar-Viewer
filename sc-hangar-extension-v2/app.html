<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC Hangar Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid rgba(51, 65, 85, 0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            background: linear-gradient(135deg, #63b3ed 0%, #4299e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .sidebar-header .version {
            font-size: 0.75rem;
            color: #64748b;
        }

        .sidebar-section {
            padding: 15px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
        }

        .sidebar-section-title {
            padding: 0 20px 10px;
            font-size: 0.75rem;
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: #cbd5e1;
            border-left: 3px solid transparent;
        }

        .sidebar-item:hover {
            background: rgba(51, 65, 85, 0.3);
            color: #e2e8f0;
        }

        .sidebar-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-left-color: #3b82f6;
            color: #3b82f6;
        }

        .sidebar-item-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .sidebar-item-text {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 {
            font-size: 1.5rem;
            color: #e2e8f0;
        }

        .topbar-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.5);
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: rgba(51, 65, 85, 0.8);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        /* View containers */
        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* Stats cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.6);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid rgba(59, 130, 246, 0.3);
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #3b82f6;
            font-size: 1.8rem;
            font-weight: bold;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 0.9);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>SC HANGAR MANAGER</h1>
                <div class="version">v2.0.2</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">YOUR ITEMS</div>
                <div class="sidebar-item active" data-view="fleet">
                    <div class="sidebar-item-icon">🏠</div>
                    <div class="sidebar-item-text">Fleet</div>
                </div>
                <div class="sidebar-item" data-view="ships">
                    <div class="sidebar-item-icon">🚀</div>
                    <div class="sidebar-item-text">Ships</div>
                </div>
                <div class="sidebar-item" data-view="vehicles">
                    <div class="sidebar-item-icon">🏎️</div>
                    <div class="sidebar-item-text">Ground Vehicles</div>
                </div>
                <div class="sidebar-item" data-view="paints">
                    <div class="sidebar-item-icon">🎨</div>
                    <div class="sidebar-item-text">Paints</div>
                </div>
                <div class="sidebar-item" data-view="equipment">
                    <div class="sidebar-item-icon">👔</div>
                    <div class="sidebar-item-text">Equipment</div>
                </div>
                <div class="sidebar-item" data-view="addons">
                    <div class="sidebar-item-icon">🔧</div>
                    <div class="sidebar-item-text">Add-ons</div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">MANAGEMENT</div>
                <div class="sidebar-item" data-view="buyback">
                    <div class="sidebar-item-icon">🔄</div>
                    <div class="sidebar-item-text">Buyback Queue</div>
                </div>
                <div class="sidebar-item" data-view="wishlist">
                    <div class="sidebar-item-icon">⭐</div>
                    <div class="sidebar-item-text">Wishlist</div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">ANALYTICS</div>
                <div class="sidebar-item" data-view="statistics">
                    <div class="sidebar-item-icon">📊</div>
                    <div class="sidebar-item-text">Statistics</div>
                </div>
                <div class="sidebar-item" data-view="value">
                    <div class="sidebar-item-icon">💰</div>
                    <div class="sidebar-item-text">Fleet Value</div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">SETTINGS</div>
                <div class="sidebar-item" data-view="settings">
                    <div class="sidebar-item-icon">⚙️</div>
                    <div class="sidebar-item-text">Settings</div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="topbar">
                <h2 id="viewTitle">Fleet Overview</h2>
                <div class="topbar-actions">
                    <button class="btn btn-secondary" id="refreshBtn">🔄 Refresh</button>
                    <button class="btn btn-primary" id="extractBtn">Extract Data</button>
                </div>
            </div>

            <div class="content-area">
                <!-- Fleet View -->
                <div id="fleet-view" class="view active">
                    <div id="fleet-content"></div>
                </div>

                <!-- Ships View -->
                <div id="ships-view" class="view">
                    <div id="ships-content"></div>
                </div>

                <!-- Vehicles View -->
                <div id="vehicles-view" class="view">
                    <div id="vehicles-content"></div>
                </div>

                <!-- Paints View -->
                <div id="paints-view" class="view">
                    <div id="paints-content"></div>
                </div>

                <!-- Equipment View -->
                <div id="equipment-view" class="view">
                    <div id="equipment-content"></div>
                </div>

                <!-- Add-ons View -->
                <div id="addons-view" class="view">
                    <div id="addons-content"></div>
                </div>

                <!-- Buyback View -->
                <div id="buyback-view" class="view">
                    <div id="buyback-content"></div>
                </div>

                <!-- Wishlist View -->
                <div id="wishlist-view" class="view">
                    <div id="wishlist-content"></div>
                </div>

                <!-- Statistics View -->
                <div id="statistics-view" class="view">
                    <div id="statistics-content"></div>
                </div>

                <!-- Value View -->
                <div id="value-view" class="view">
                    <div id="value-content"></div>
                </div>

                <!-- Settings View -->
                <div id="settings-view" class="view">
                    <div id="settings-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="loaner-matrix.js"></script>
    <script src="ships-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
