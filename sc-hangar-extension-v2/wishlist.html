<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Wishlist - SC Hangar Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(51, 65, 85, 0.5);
            border: none;
            border-radius: 8px;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(51, 65, 85, 0.8);
        }

        .tab.active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .wishlist-total {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(37, 99, 235, 0.2) 100%);
            border: 2px solid rgba(59, 130, 246, 0.4);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .wishlist-total h2 {
            font-size: 1.2rem;
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .wishlist-total .total-price {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3b82f6;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.5);
            color: #e2e8f0;
            font-size: 1rem;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #60a5fa;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .item-card {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .item-card.in-wishlist {
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(30, 41, 59, 0.8);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .item-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #60a5fa;
        }

        .item-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #3b82f6;
        }

        .item-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .item-detail {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        .wishlist-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .wishlist-btn.add {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .wishlist-btn.remove {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }

        .wishlist-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        #allShipsTab, #wishlistTab {
            display: none;
        }

        #allShipsTab.active, #wishlistTab.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⭐ Ship Wishlist</h1>
            <p>Browse all Star Citizen ships and build your dream fleet</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="allShips">All Ships</button>
            <button class="tab" data-tab="wishlist">My Wishlist</button>
            <button class="tab" data-tab="hangar">My Hangar</button>
        </div>

        <div class="wishlist-total">
            <h2>Wishlist Total</h2>
            <div class="total-price" id="wishlistTotal">$0</div>
            <div style="color: #94a3b8; margin-top: 10px;" id="wishlistCount">0 ships</div>
        </div>

        <div class="controls">
            <input type="text" id="searchBox" class="search-box" placeholder="Search ships...">
            <select id="availabilityFilter" class="search-box" style="flex: 0 0 200px;">
                <option value="all">All Ships</option>
                <option value="available">Available</option>
                <option value="unavailable">Unavailable</option>
            </select>
            <button class="btn btn-primary" id="refreshBtn">🔄 Refresh Ships</button>
        </div>

        <div id="allShipsTab" class="active">
            <div id="allShipsContent"></div>
        </div>

        <div id="wishlistTab">
            <div id="wishlistContent"></div>
        </div>
    </div>

    <script src="ships-database.js"></script>
    <script src="wishlist.js"></script>
</body>
</html>
